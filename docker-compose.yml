version: '3.8'

services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      # Database Configuration (Individual Components)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=learnify
      - DB_PASSWORD=learnify_password
      - DB_NAME=learnify_db
      - DB_DRIVER=postgresql+asyncpg
      
      # Redis Configuration (Individual Components)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      
      # JWT Configuration
      - SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ALGORITHM=HS256
      
      # Email Configuration (SendGrid)
      - SENDGRID_API_KEY=your-sendgrid-api-key
      - FROM_EMAIL=noreply@learnify.com
      - FROM_NAME=Learnify LMS
      
      # App Configuration
      - APP_NAME=Learnify LMS
      - VERSION=1.0.0
      - DEBUG=true
      
      # CORS
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000
      
      # OTP Configuration
      - OTP_EXPIRE_MINUTES=10
    depends_on:
      - db
      - redis
    volumes:
      # Mount source code for development (comment out for production)
      - .:/app
      # Mount logs directory
      - ./logs:/app/logs
    networks:
      - learnify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=learnify_db
      - POSTGRES_USER=learnify
      - POSTGRES_PASSWORD=learnify_password
      - POSTGRES_INITDB_ARGS="--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
      # Custom PostgreSQL configuration
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    networks:
      - learnify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnify -d learnify_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      # Persist Redis data
      - redis_data:/data
      # Custom Redis configuration
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - learnify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Commander (Redis Web UI for development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - learnify-network
    profiles:
      - dev  # Only start with --profile dev

  # pgAdmin (PostgreSQL Web UI for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@learnify.com
      - PGADMIN_DEFAULT_PASSWORD=admin_password
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - learnify-network
    profiles:
      - dev  # Only start with --profile dev

# Volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Networks
networks:
  learnify-network:
    driver: bridge 