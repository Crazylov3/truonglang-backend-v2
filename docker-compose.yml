services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      # Database Configuration (from .env file)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_DRIVER=${DB_DRIVER}
      
      # Redis Configuration (from .env file)
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      
      # JWT Configuration (from .env file)
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - ALGORITHM=${ALGORITHM}
      
      # Email Configuration (from .env file)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}
      
      # App Configuration (from .env file)
      - APP_NAME=${APP_NAME}
      - VERSION=${VERSION}
      - DEBUG=${DEBUG}
      
      # CORS (from .env file)
      - CORS_ORIGINS=${CORS_ORIGINS}
      
      # OTP Configuration (from .env file)
      - OTP_EXPIRE_MINUTES=${OTP_EXPIRE_MINUTES}
    depends_on:
      - db
      - redis
    volumes:
      # Mount source code for development (excluding .venv to avoid permission issues)
      - ./app:/app/app:ro
      - ./cfg:/app/cfg:ro
      - ./scripts:/app/scripts:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
      # Mount logs directory (writable)
      - ./logs:/app/logs
      # UV cache to custom directory
    networks:
      - learnify-network
    restart: unless-stopped

    entrypoint: ['uv', 'run', 'uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--reload']

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    ports:
      - "5432:5432"
    volumes:
      # Persist database data to custom directory
      - ~/.truonglang_web_data/postgres:/var/lib/postgresql/data
      # Custom PostgreSQL configuration
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    networks:
      - learnify-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      # Persist Redis data to custom directory
      - ~/.truonglang_web_data/redis:/data
      # Custom Redis configuration
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - learnify-network
    restart: unless-stopped

  # Redis Commander (Redis Web UI for development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - learnify-network
    profiles:
      - dev  # Only start with --profile dev


  # pgAdmin (PostgreSQL Web UI for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@learnify.com
      - PGADMIN_DEFAULT_PASSWORD=admin_password
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_IMPORT_SERVERS=/pgadmin4/servers.json
    ports:
      - "8080:80"
    volumes:
      # Mount server configuration for auto-connect
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/var/lib/pgadmin/storage/pgpass:ro
    depends_on:
      - db
    networks:
      - learnify-network
    profiles:
      - dev  # Only start with --profile dev

# Networks
networks:
  learnify-network:
    driver: bridge 