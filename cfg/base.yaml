# Base Configuration for Giao Duc Thang Long
# This file contains non-sensitive configuration that can be version controlled

app:
  name: "Giao Duc Thang Long"
  version: "1.0.0"
  description: "A modern Learning Management System API built with FastAPI"
  
database:
  driver: "postgresql+asyncpg"
  port: 5432
  name: "learnify_db"

redis:
  port: 6379
  db: 0

jwt:
  algorithm: "HS256"
  access_token_expire_minutes: 259200

email:
  from_name: "Giao Duc Thang Long"

security:
  otp_expire_minutes: 15
  password_reset_expire_minutes: 5
  csrf_token_expire_minutes: 60
  allowed_hosts: ["*"]  # Allow all hosts in base config

media_root: "/app/media"

cors:
  origins: []

rate_limit:
  enabled: true
  reset_on_startup: false  # Set to true in development
  # Default limits
  requests_per_minute: 120
  requests_per_hour: 1000
  burst_size: 10
  # Endpoint specific limits
  endpoints:
    login:
      path: "/api/v1/auth/login"
      per_minute: 120
      per_hour: 2000
    register:
      path: "/api/v1/auth/register"
      per_minute: 120
      per_hour: 2000
    forgot_password:
      path: "/api/v1/auth/forgot-password"
      per_minute: 120
      per_hour: 2000
    reset_password:
      path: "/api/v1/auth/reset-password"
      per_minute: 120
      per_hour: 2000
    payments:
      path: "/api/v1/payments"
      per_minute: 120
      per_hour: 2000