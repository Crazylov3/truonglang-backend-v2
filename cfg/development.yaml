# Development Configuration
# Overrides base.yaml settings for development environment

app:
  debug: true

database:
  host: "localhost"

redis:
  host: "localhost"

cors:
  origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:3002"
    - "http://localhost:3003"
    - "http://localhost:8000"
    # Add subdomain origins for testing
    - "http://teacher.localhost:3001"
    - "http://admin.localhost:3002"
    - "http://auth.localhost:3003"  # Your login page

# Cookie configuration for localhost testing
cookies:
  domain: null  # No domain sharing - cookies only work on exact same origin
  samesite: "lax"

email:
  from_email: "dev@learnify.com"

rate_limit:
  enabled: true
  reset_on_startup: true  # Clear rate limits on startup for easier testing
  # More generous limits for development
  requests_per_minute: 120
  requests_per_hour: 2000
  burst_size: 20 